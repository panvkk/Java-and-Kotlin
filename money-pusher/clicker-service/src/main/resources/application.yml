server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/clicker-service_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true