services:
  postgres:
    image: postgres:16-alpine
    container_name: clicker-service-postgres
    environment:
      POSTGRES_DB: clicker-service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: