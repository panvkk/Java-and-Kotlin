openapi: 3.0.3

info:
  title: Money Pusher API
  version: 1.1.0
  description: |
    Публичный HTTP API проекта Money Pusher. Все запросы идут через `api-gateway`
    (`http://localhost:8080`).

    ## Аутентификация
    - `POST /api/v1/auth/register` и `POST /api/v1/auth/authenticate` возвращают
      только `access_token` (≈15 минут) в JSON.
    - Refresh-токен (≈7 дней) приходит в заголовке `Set-Cookie` как `refresh_token`
      (`HttpOnly`, `Secure`, `SameSite=Lax`, `Path=/api/v1`). Из JavaScript он
      недоступен, хранить его в `localStorage`/`sessionStorage` не нужно.
    - Защищённые запросы: `Authorization: Bearer <access_token>`.
    - Обновление: `POST /api/v1/auth/refresh-token` без тела и без заголовка
      `Authorization`. Refresh-токен читается из cookie, поэтому запрос нужно
      отправлять с `credentials: 'include'` — браузер сам приложит cookie и
      сохранит новый `Set-Cookie`.
    - Refresh-токен одноразовый: при обновлении возвращается новый `access_token`
      и ротированный refresh-cookie, старый refresh становится недействительным.
      Не делайте параллельных refresh.
    - `POST /api/v1/logout` требует access token в заголовке и в теле, refresh-токен
      читается из cookie; успешный ответ очищает cookie.

    ## Деньги и время
    - Все суммы — целые числа (`int64`), единица — coin.
    - `created_at` у переводов — ISO-8601 UTC.
    - `timestamp` в ошибках — локальное время сервера без таймзоны.

    ## Асинхронность
    - `POST /api/v1/transfers` возвращает `202` и `status: PENDING`.
      Итоговый статус (`SUCCESS` / `FAILED`) появляется позже в `GET /api/v1/transfers`.
    - После регистрации баланс создаётся асинхронно (Kafka), поэтому первый
      `GET /api/v1/clicker/balance/{user_email}` может вернуть `400`. Нужен retry.

    ## Ограничения
    - Rate limit на IP: auth 5 req/s (burst 10), clicker 10 req/s (burst 20),
      transfers 5 req/s (burst 10). При превышении — `429`.
    - CORS разрешён для `http://localhost:5500`, `http://127.0.0.1:5500`,
      `http://localhost:8085`, `http://127.0.0.1:8085` и `https://clicker.asphalt.by`.
    - Пагинации в истории переводов нет.
    - Идемпотентности `POST /transfers` нет: повтор создаёт новый перевод.
  contact:
    name: Money Pusher backend team

servers:
  - url: http://localhost:8080
    description: Локальный api-gateway
  - url: https://clicker.asphalt.by
    description: Production (фронтенд и API на одном origin)

tags:
  - name: Auth
    description: Регистрация, вход, обновление токенов и выход
  - name: Users
    description: Профили пользователей
  - name: Clicker
    description: Клики и баланс
  - name: Leaderboard
    description: Таблица лидеров
  - name: Transfers
    description: Переводы coins между пользователями

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      description: |
        Создаёт пользователя и сразу выдаёт access token и refresh-cookie.
        Роль всегда `USER`; поле `role` не поддерживается.
        После регистрации баланс создаётся асинхронно.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nickname: demo
              email: demo@example.com
              password: password123
      responses:
        '200':
          description: Пользователь создан, access token выдан, refresh-cookie установлена
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже занят (гонка при одновременной регистрации)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/authenticate:
    post:
      tags: [Auth]
      summary: Вход
      description: |
        Аутентификация по email и паролю. В ответе только `access_token`,
        refresh-токен приходит в `Set-Cookie`.
      operationId: authenticate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
            example:
              email: demo@example.com
              password: password123
      responses:
        '200':
          description: Успешный вход, access token выдан, refresh-cookie установлена
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Обновление access-токена
      description: |
        Тела нет, заголовок `Authorization` не нужен. Refresh-токен читается из
        cookie `refresh_token`, поэтому запрос нужно отправлять с
        `credentials: 'include'`, иначе браузер не приложит cookie.

        В ответ приходит новый `access_token` и ротированный `Set-Cookie` с новым
        refresh-токеном. Старый refresh-токен сразу инвалидируется (ротация),
        поэтому параллельные refresh приведут к `401`.
      operationId: refreshToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: Новый access token и ротированная refresh-cookie
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: |
            Cookie `refresh_token` отсутствует, невалидна, истекла или уже
            использована. Если cookie не пришла, тело ответа пустое.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/logout:
    post:
      tags: [Auth]
      summary: Выход
      description: |
        Access token добавляется в blacklist, refresh token удаляется на сервере,
        cookie `refresh_token` очищается в ответе (`Max-Age=0`).

        Требует access token в заголовке `Authorization` и в теле запроса:
        gateway по заголовку определяет пользователя и передаёт `X-User-Name`.
        Refresh-токен читается из cookie, передавать его в теле не нужно.
      operationId: logout
      security:
        - bearerAuth: []
          cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              access_token: eyJhbGciOiJIUzI1NiJ9...
      responses:
        '200':
          description: Сессия завершена, refresh-cookie очищена (пустое тело)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenClearCookie'
        '400':
          description: Cookie `refresh_token` отсутствует в запросе
        '401':
          description: |
            Невалидный или истёкший access/refresh token либо токены принадлежат
            разным пользователям.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/users/{user_email}:
    get:
      tags: [Users]
      summary: Профиль пользователя
      description: |
        Публичный эндпоинт. Если пользователь не найден, возвращается **401**, а не 404.
        Обновления профиля в API нет.
      operationId: getUserProfile
      security: []
      parameters:
        - name: user_email
          in: path
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
          example: demo@example.com
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Пользователь с таким email не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/clicker:
    patch:
      tags: [Clicker]
      summary: Увеличить баланс
      description: |
        Увеличивает баланс текущего пользователя. Пользователь определяется по access token.
        Контракт: `balance_increase` от 1 до 5; для клика отправляйте `1`.
        Текущая реализация не валидирует диапазон, поэтому ограничение — на клиенте.
      operationId: increaseBalance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncreaseBalanceRequest'
            example:
              balance_increase: 1
      responses:
        '200':
          description: Баланс обновлён (пустое тело)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/clicker/balance/{user_email}:
    get:
      tags: [Clicker]
      summary: Баланс пользователя
      description: |
        Возвращает баланс в coin. Сразу после регистрации запись баланса может ещё не
        существовать — в этом случае вернётся 400, повторите запрос с backoff.
      operationId: getBalance
      security:
        - bearerAuth: []
      parameters:
        - name: user_email
          in: path
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
          example: demo@example.com
      responses:
        '200':
          description: Баланс пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Баланс для пользователя не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Таблица лидеров
      description: Топ-10 пользователей по балансу (по убыванию). Публичный эндпоинт.
      operationId: getLeaderboard
      security: []
      responses:
        '200':
          description: Таблица лидеров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/transfers:
    get:
      tags: [Transfers]
      summary: История переводов
      description: |
        Все переводы текущего пользователя — входящие и исходящие, сортировка по
        `created_at` DESC. Пагинации нет. Направление определяется клиентом по
        `initiator_email`.
      operationId: getTransfers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список переводов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransfersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags: [Transfers]
      summary: Создать перевод
      description: |
        Создаёт перевод и ставит его в асинхронную обработку (saga через Kafka).
        Ответ `202` означает «принято», а не «выполнено»: итоговый статус нужно
        получить через `GET /api/v1/transfers`.

        Наличие получателя и достаточность средств не проверяются синхронно.
        Перевод самому себе отклоняется с `400`. Идемпотентности нет.
      operationId: createTransfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              target_user_email: friend@example.com
              transfer_amount: 10
              additional_message: gg
      responses:
        '202':
          description: Перевод принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transfer_id: 17
                transfer_amount: 10
                initiator_email: demo@example.com
                target_email: friend@example.com
                additional_message: gg
                status: PENDING
                created_at: '2026-11-14T09:15:30.123456Z'
        '400':
          description: Невалидное тело или перевод самому себе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token для защищённых эндпоинтов: `Authorization: Bearer <access_token>`.
        Refresh-токен в этом заголовке больше не принимается.
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Refresh-токен в HttpOnly cookie `refresh_token`
        (`Secure`, `SameSite=Lax`, `Path=/api/v1`).
        Cookie устанавливается на `register`, `authenticate` и `refresh-token`
        и очищается на `logout`. Из JavaScript недоступна.

  parameters:
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: |
        Refresh-токен, который браузер отправляет автоматически.
        Для `refresh-token` фактически обязателен: без него вернётся `401`.
        Для `logout` без него вернётся `400`.
      schema:
        type: string

  headers:
    RefreshTokenSetCookie:
      description: |
        Новый refresh-токен. Формат:
        `refresh_token=<jwt>; Path=/api/v1; Max-Age=<refreshTokenExpiration/1000>;
        HttpOnly; Secure; SameSite=Lax`.
      schema:
        type: string
    RefreshTokenClearCookie:
      description: |
        Очищает refresh-cookie: `refresh_token=; Path=/api/v1; Max-Age=0;
        HttpOnly; Secure; SameSite=Lax`.
      schema:
        type: string

  responses:
    BadRequest:
      description: Ошибка валидации или бизнес-правила
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Токен отсутствует, истёк, невалиден, имеет неверный тип или находится в blacklist.
        Gateway может вернуть 401 с пустым телом.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Превышен rate limit (на IP)
      headers:
        X-RateLimit-Replenish-Rate:
          description: Скорость пополнения (запросов в секунду)
          schema:
            type: integer
        X-RateLimit-Burst-Capacity:
          description: Размер burst-окна
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Остаток токенов в текущем окне
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AuthTokens:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: |
            JWT для защищённых запросов, ≈15 минут.
            Refresh-токен в теле не возвращается — он приходит в `Set-Cookie`.

    RegisterRequest:
      type: object
      required: [nickname, email, password]
      properties:
        nickname:
          type: string
          minLength: 1
          example: demo
        email:
          type: string
          format: email
          example: demo@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    AuthenticationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: demo@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    LogoutRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: |
            Действующий access token. Должен совпадать с токеном в заголовке
            `Authorization: Bearer`.
            Refresh-токен передавать не нужно — он читается из cookie.

    UserProfile:
      type: object
      required: [nickname, email, role]
      properties:
        nickname:
          type: string
          example: demo
        email:
          type: string
          format: email
          example: demo@example.com
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    IncreaseBalanceRequest:
      type: object
      required: [balance_increase]
      properties:
        balance_increase:
          type: integer
          format: int64
          minimum: 1
          maximum: 5
          description: Для клика отправляйте 1
          example: 1

    Balance:
      type: object
      required: [user_balance]
      properties:
        user_balance:
          type: integer
          format: int64
          minimum: 0
          example: 42

    LeaderboardResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/LeaderboardItem'

    LeaderboardItem:
      type: object
      required: [balance, user_nickname, user_email]
      properties:
        balance:
          type: integer
          format: int64
          example: 120
        user_nickname:
          type: string
          example: demo
        user_email:
          type: string
          format: email
          example: demo@example.com

    TransferRequest:
      type: object
      required: [target_user_email, transfer_amount]
      properties:
        target_user_email:
          type: string
          format: email
          example: friend@example.com
        transfer_amount:
          type: integer
          format: int64
          minimum: 1
          example: 10
        additional_message:
          type: string
          maxLength: 255
          nullable: true
          example: gg

    Transfer:
      type: object
      required:
        - transfer_id
        - transfer_amount
        - initiator_email
        - target_email
        - status
        - created_at
      properties:
        transfer_id:
          type: integer
          format: int64
          example: 17
        transfer_amount:
          type: integer
          format: int64
          example: 10
        initiator_email:
          type: string
          format: email
          example: demo@example.com
        target_email:
          type: string
          format: email
          example: friend@example.com
        additional_message:
          type: string
          nullable: true
          maxLength: 255
          example: gg
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
          example: PENDING
        created_at:
          type: string
          format: date-time
          description: ISO-8601 UTC
          example: '2026-11-14T09:15:30.123456Z'

    UserTransfersResponse:
      type: object
      required: [transfers]
      properties:
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'

    ErrorResponse:
      type: object
      required: [timestamp, error, message]
      properties:
        timestamp:
          type: string
          description: Локальное время сервера без таймзоны
          example: '2026-11-14T12:34:56.789'
        error:
          type: string
          example: Bad request.
        message:
          type: string
          example: User cannot transfer to himself.
