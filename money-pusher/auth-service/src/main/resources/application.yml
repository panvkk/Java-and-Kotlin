spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/money-pusher_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true