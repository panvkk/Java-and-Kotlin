<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Testing UI</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #f1f5f9; font-size: 1.5rem; text-align: center; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: #0f172a; padding: 4px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn.active { background: #3b82f6; color: #ffffff; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #3b82f6; }
        button.submit-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #3b82f6; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button.submit-btn:hover { background: #2563eb; }
        button.logout-btn { background: #ef4444; }
        button.logout-btn:hover { background: #dc2626; }
        button.secondary-btn { background: #475569; margin-top: 10px; }
        button.secondary-btn:hover { background: #334155; }
        .hidden { display: none; }
        .token-box { background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; word-break: break-all; color: #38bdf8; max-height: 80px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #334155; }
        .status-msg { margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; }
        .status-msg.error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .status-msg.success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
        .config { margin-bottom: 20px; text-align: center; }
        .config input { font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div class="config">
        <label>Base API URL</label>
        <input type="text" id="baseUrl" value="http://localhost:8080">
    </div>

    <!-- Табы для гостей -->
    <div id="authTabs" class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
        <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- Сообщение о статусе -->
    <div id="statusMsg" class="status-msg hidden"></div>

    <!-- Форма Входа -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <h2>Авторизация</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required placeholder="user@example.com">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn">Войти</button>
    </form>

    <!-- Форма Регистрации -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <h2>Регистрация</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUsername" required placeholder="johndoe">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" required placeholder="user@example.com">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Роль</label>
            <select id="regRole">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>

    <!-- Экран Профиля -->
    <div id="profileView" class="hidden">
        <h2>Профиль пользователя</h2>

        <label>Access Token:</label>
        <div id="displayAccessToken" class="token-box">-</div>

        <label>Refresh Token:</label>
        <div id="displayRefreshToken" class="token-box">-</div>

        <button onclick="handleRefreshToken()" class="submit-btn secondary-btn">Обновить токен (Refresh)</button>
        <button onclick="handleLogout()" class="submit-btn logout-btn" style="margin-top: 10px;">Выйти из аккаунта</button>
    </div>
</div>

<script>
    let accessToken = localStorage.getItem('access_token') || '';
    let refreshToken = localStorage.getItem('refresh_token') || '';

    // Инициализация при загрузке
    window.onload = () => {
        if (accessToken) {
            showProfile();
        }
    };

    function switchTab(tab) {
        hideStatus();
        const isLogin = tab === 'login';
        document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
        document.getElementById('registerForm').classList.toggle('hidden', isLogin);

        const tabs = document.querySelectorAll('.tab-btn');
        tabs[0].classList.toggle('active', isLogin);
        tabs[1].classList.toggle('active', !isLogin);
    }

    function showStatus(text, isError = false) {
        const el = document.getElementById('statusMsg');
        el.textContent = text;
        el.className = `status-msg ${isError ? 'error' : 'success'}`;
        el.classList.remove('hidden');
    }

    function hideStatus() {
        document.getElementById('statusMsg').classList.add('hidden');
    }

    function saveTokens(access, refresh) {
        accessToken = access;
        refreshToken = refresh;
        localStorage.setItem('access_token', access);
        localStorage.setItem('refresh_token', refresh);
    }

    function clearTokens() {
        accessToken = '';
        refreshToken = '';
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
    }

    function showProfile() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('authTabs').classList.add('hidden');
        document.getElementById('profileView').classList.remove('hidden');

        document.getElementById('displayAccessToken').textContent = accessToken || 'Отсутствует';
        document.getElementById('displayRefreshToken').textContent = refreshToken || 'Отсутствует';
    }

    function showAuth() {
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('authTabs').classList.remove('hidden');
        switchTab('login');
    }

    function getBaseUrl() {
        return document.getElementById('baseUrl').value.replace(/\/$/, '');
    }

    // POST /api/v1/auth/authenticate
    async function handleLogin(e) {
        e.preventDefault();
        hideStatus();

        const body = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };

        try {
            const res = await fetch(`${getBaseUrl()}/api/v1/auth/authenticate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!res.ok) throw new Error(`Ошибка: ${res.status}`);

            const data = await res.json();
            saveTokens(data.access_token, data.refresh_token);
            showStatus('Успешный вход!');
            setTimeout(showProfile, 500);
        } catch (err) {
            showStatus(err.message, true);
        }
    }

    // POST /api/v1/auth/register
    async function handleRegister(e) {
        e.preventDefault();
        hideStatus();

        const body = {
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
        };

        try {
            const res = await fetch(`${getBaseUrl()}/api/v1/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!res.ok) throw new Error(`Ошибка: ${res.status}`);

            const data = await res.json();
            saveTokens(data.access_token, data.refresh_token);
            showStatus('Успешная регистрация!');
            setTimeout(showProfile, 500);
        } catch (err) {
            showStatus(err.message, true);
        }
    }

    // POST /api/v1/auth/refresh-token
    async function handleRefreshToken() {
        hideStatus();

        try {
            const res = await fetch(`${getBaseUrl()}/api/v1/auth/refresh-token`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${refreshToken}`
                }
            });

            if (!res.ok) throw new Error(`Ошибка обновления: ${res.status}`);

            const data = await res.json();
            saveTokens(data.access_token, data.refresh_token);
            showProfile();
            showStatus('Токены успешно обновлены!');
        } catch (err) {
            showStatus(err.message, true);
        }
    }

    // POST /api/v1/logout
    async function handleLogout() {
        hideStatus();

        try {
            const res = await fetch(`${getBaseUrl()}/api/v1/logout`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                },
                body: JSON.stringify({
                    requestToken: refreshToken
                })
            });

            if (!res.ok) console.warn('Сервер вернул ошибку при логауте:', res.status);

            clearTokens();
            showAuth();
            showStatus('Вы успешно вышли');
        } catch (err) {
            // Даже если бэк упал, сбрасываем локальные токены
            clearTokens();
            showAuth();
            showStatus('Вышли (локально)', true);
        }
    }
</script>
</body>
</html>
