<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Security Auth App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

<div class="max-w-md mx-auto w-full p-6 mt-10">
    <!-- Навигационные вкладки -->
    <div class="flex rounded-lg bg-gray-200 p-1 mb-6" id="navTabs">
        <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-md transition bg-white shadow-sm text-gray-800">Вход</button>
        <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-md transition text-gray-600">Регистрация</button>
        <button onclick="switchTab('profile')" id="tab-profile" class="flex-1 py-2 text-sm font-medium rounded-md transition text-gray-600 hidden">Профиль</button>
    </div>

    <!-- Контейнер карточек -->
    <div class="bg-white p-6 rounded-xl shadow-md space-y-4">

        <!-- Вкладка 1: Вход -->
        <div id="view-login" class="space-y-4">
            <h2 class="text-xl font-bold text-gray-800">Вход в систему</h2>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Email</label>
                <input type="email" id="authEmail" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="user@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Пароль</label>
                <input type="password" id="authPassword" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
            </div>
            <button onclick="authenticate()" class="w-full bg-blue-600 text-white p-2.5 rounded-lg hover:bg-blue-700 font-medium text-sm transition">Войти</button>
        </div>

        <!-- Вкладка 2: Регистрация -->
        <div id="view-register" class="space-y-4 hidden">
            <h2 class="text-xl font-bold text-gray-800">Регистрация</h2>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Имя пользователя (Username)</label>
                <input type="text" id="regUsername" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="ivan">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Email</label>
                <input type="email" id="regEmail" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="user@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Пароль</label>
                <input type="password" id="regPassword" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Роль</label>
                <select id="regRole" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <button onclick="register()" class="w-full bg-green-600 text-white p-2.5 rounded-lg hover:bg-green-700 font-medium text-sm transition">Зарегистрироваться</button>
        </div>

        <!-- Вкладка 3: Профиль -->
        <div id="view-profile" class="space-y-4 hidden">
            <div class="flex items-center justify-between border-b pb-3">
                <h2 class="text-xl font-bold text-gray-800">Профиль пользователя</h2>
                <span class="px-2.5 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full" id="userRoleBadge">USER</span>
            </div>
            <div class="space-y-2">
                <div>
                    <span class="text-xs text-gray-400 uppercase">Субъект / Email:</span>
                    <p id="profileEmail" class="text-sm font-medium text-gray-800 font-mono">-</p>
                </div>
                <div>
                    <span class="text-xs text-gray-400 uppercase">Срок действия токена до:</span>
                    <p id="profileExp" class="text-sm font-medium text-gray-800 font-mono">-</p>
                </div>
            </div>
            <div class="pt-2 space-y-2">
                <button onclick="refreshToken()" class="w-full bg-purple-600 text-white p-2.5 rounded-lg hover:bg-purple-700 font-medium text-sm transition">Обновить Access Token</button>
                <button onclick="logout()" class="w-full bg-red-600 text-white p-2.5 rounded-lg hover:bg-red-700 font-medium text-sm transition">Выйти из профиля</button>
            </div>
        </div>

    </div>

    <!-- Консоль для отладки ответов -->
    <div class="mt-6 bg-gray-900 text-gray-200 p-4 rounded-xl shadow text-xs font-mono">
        <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-1">
            <span class="text-gray-400 uppercase tracking-wider">Логи / Ответ сервера:</span>
            <button onclick="clearLogs()" class="text-gray-500 hover:text-gray-300 text-[10px]">Очистить</button>
        </div>
        <pre id="output" class="overflow-x-auto h-28 text-green-400">Готов к работе...</pre>
    </div>
</div>

<script>
    // Инициализация при загрузке страницы: проверяем, есть ли уже сохраненный токен
    window.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('access_token');
        if (token) {
            showProfileData(token);
            switchTab('profile');
        }
    });

    function log(data) {
        const output = document.getElementById('output');
        output.innerText = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
    }

    function clearLogs() {
        document.getElementById('output').innerText = 'Логи очищены...';
    }

    function switchTab(tabName) {
        ['login', 'register', 'profile'].forEach(name => {
            document.getElementById(`view-${name}`).classList.add('hidden');
            document.getElementById(`tab-${name}`).classList.remove('bg-white', 'shadow-sm', 'text-gray-800');
            document.getElementById(`tab-${name}`).classList.add('text-gray-600');
        });

        document.getElementById(`view-${tabName}`).classList.remove('hidden');
        const activeTab = document.getElementById(`tab-${tabName}`);
        activeTab.classList.add('bg-white', 'shadow-sm', 'text-gray-800');
        activeTab.classList.remove('text-gray-600');
    }

    function handleAuthSuccess(json) {
        if (json.access_token) {
            localStorage.setItem('access_token', json.access_token);
        }
        if (json.refresh_token) {
            localStorage.setItem('refresh_token', json.refresh_token);
        }
        // Показываем вкладку профиля и скрываем вход/регистрацию в навигации
        document.getElementById('tab-profile').classList.remove('hidden');
        showProfileData(json.access_token);
        switchTab('profile');
    }

    function showProfileData(token) {
        try {
            // Распаковка JWT payload на клиенте (base64)
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const payload = JSON.parse(jsonPayload);
            document.getElementById('profileEmail').innerText = payload.sub || 'Неизвестно';

            if (payload.exp) {
                const expDate = new Date(payload.exp * 1000);
                document.getElementById('profileExp').innerText = expDate.toLocaleTimeString();
            }
        } catch (e) {
            console.error("Ошибка парсинга токена", e);
        }
    }

    async function register() {
        const body = {
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
        };
        try {
            const res = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json();
            log(json);
            if (res.ok) handleAuthSuccess(json);
        } catch (e) {
            log('Ошибка сети: ' + e.message);
        }
    }

    async function authenticate() {
        const body = {
            email: document.getElementById('authEmail').value,
            password: document.getElementById('authPassword').value
        };
        try {
            const res = await fetch('/api/v1/auth/authenticate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json();
            log(json);
            if (res.ok) handleAuthSuccess(json);
        } catch (e) {
            log('Ошибка сети: ' + e.message);
        }
    }

    async function refreshToken() {
        const refToken = localStorage.getItem('refresh_token');
        if (!refToken) {
            alert('Refresh token отсутствует!');
            return;
        }
        try {
            const res = await fetch('/api/v1/auth/refresh-token', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + refToken }
            });
            const json = await res.json();
            log(json);
            if (res.ok) {
                handleAuthSuccess(json);
                alert('Токен успешно обновлен!');
            }
        } catch (e) {
            log('Ошибка сети: ' + e.message);
        }
    }

    async function logout() {
        const accToken = localStorage.getItem('access_token');
        const refToken = localStorage.getItem('refresh_token');

        try {
            const res = await fetch('/api/v1/logout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + accToken
                },
                body: JSON.stringify({ requestToken: refToken })
            });

            log('Логаут выполнен со статусом: ' + res.status);
        } catch (e) {
            log('Ошибка при логауте (но сессия на клиенте будет очищена): ' + e.message);
        } finally {
            // Очищаем локальное хранилище и возвращаем интерфейс на вкладку входа
            localStorage.clear();
            document.getElementById('tab-profile').classList.add('hidden');
            switchTab('login');
        }
    }
</script>
</body>
</html>
