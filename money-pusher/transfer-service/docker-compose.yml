services:
  postgres:
    image: postgres:16-alpine
    container_name: transfer-service-postgres
    environment:
      POSTGRES_DB: transfer-service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: