server:
  port: ${GATEWAY_PORT:8080}

spring:
  # Local development only: load money-pusher/.env as a properties file.
  # In Docker/CI the same values are provided as real environment variables,
  # so these optional imports simply find nothing and are skipped.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:./money-pusher/.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/logout/**

            - id: clicker-service-route
              uri: ${CLICKER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/clicker/**,/api/v1/leaderboard

            - id: transfer-service-route
              uri: ${TRANSFER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/transfers/**

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
